
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commercial Work</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .page {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }

    .title {
      width: min(1100px, 100%);
      margin: 0 auto 35px;
      font-size: clamp(16px, 1.2vw, 24px);
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #fff;
    }

    .reel-window {
      position: relative;
      width: 1100px;
      max-width: 100%;
      height: 160px;
      margin: 0 auto;
      overflow: hidden;
      background: #000;

      -webkit-mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
      );

      mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
      );
    }

    .reel {
      display: flex;
      width: max-content;
      height: 160px;
      animation: scroll 131s linear infinite;
      animation-play-state: paused;
      will-change: transform;
    }

    .reel.running {
      animation-play-state: running;
    }

    .reel-group {
      display: flex;
      align-items: center;
      height: 160px;
      gap: 4px;
      padding-right: 4px;
      flex-shrink: 0;
      background: #000;
    }

    .video-card {
      position: relative;
      width: calc(150px * 16 / 9);
      height: 150px;
      flex-shrink: 0;
      overflow: hidden;
      background: #000;
      border: 0;
    }

    .video-card video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @media (max-width: 900px) {
      .reel {
        animation-duration: 109s;
      }

      .reel-window {
        -webkit-mask-image: linear-gradient(
          to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        );

        mask-image: linear-gradient(
          to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        );
      }
    }

    body.compact .page {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body.compact .title {
      display: none;
    }

    body.compact .reel-window {
      width: 1100px;
      max-width: 100%;
      height: 160px;
      margin: 0 auto;
    }

    body.compact .reel,
    body.compact .reel-group {
      height: 160px;
    }

    html:has(body.compact),
    body.compact,
    body.compact .page {
      background: transparent;
    }
  </style>
</head>

<body>

<script>
  if (
    new URLSearchParams(location.search).get("mode")
    === "compact"
  ) {
    document.body.classList.add("compact");
  }
</script>

<main class="page">
  <div class="title">Commercial Work</div>

  <div class="reel-window" id="reel-window">
    <div class="reel" id="reel">
      <div class="reel-group" id="first-group"></div>
      <div
        class="reel-group"
        id="second-group"
        aria-hidden="true"
      ></div>
    </div>
  </div>
</main>

<script>
  const videoFiles = [
    "A1_Forsvaret3.mp4",
    "A2_Postnord1.mp4",
    "A3_Electrolux.mp4",
    "A5_Postnord5.mp4",
    "A6_Forsvaret1.mp4",
    "A7_Estrid.mp4",
    "A8_Postnord3.mp4",
    "A9_storytell.mp4",
    "AB1_forsvaret4.mp4",
    "AB2_st1.mp4",
    "AB3_RedCross.mp4",
    "AB4_Postnord7.mp4",
    "AB5_Netonnet.mp4",
    "AB6_Postnord4.mp4",
    "AB7_CocaCola.mp4",
    "AB8_Postnord6.mp4",
    "AB9_Forsvaret2.mp4",
    "ABC1_Postnord2.mp4"
  ];

  const reel = document.getElementById("reel");
  const reelWindow = document.getElementById("reel-window");
  const firstGroup = document.getElementById("first-group");
  const secondGroup = document.getElementById("second-group");

  const CARD_WIDTH = 150 * 16 / 9;
  const CARD_STEP = CARD_WIDTH + 4;

  // Extra space ahead of the visible window.
  const LOOKAHEAD = 700;
  const LOOKBEHIND = 150;

  // A small reusable pool of video elements.
  const MAX_PLAYERS = 9;

  const cards = [];
  const active = new Map();
  const available = [];

  let pageVisible = false;
  let frameId = null;
  let lastFrame = 0;

  function buildGroup(group) {
    videoFiles.forEach((filename, index) => {
      const card = document.createElement("div");
      card.className = "video-card";
      card.dataset.filename = filename;
      card.dataset.index = index;

      group.appendChild(card);
      cards.push(card);
    });
  }

  buildGroup(firstGroup);
  buildGroup(secondGroup);

  function makePlayer() {
    const video = document.createElement("video");

    video.muted = true;
    video.defaultMuted = true;
    video.loop = true;
    video.playsInline = true;
    video.autoplay = false;
    video.preload = "none";

    video.setAttribute("muted", "");
    video.setAttribute("loop", "");
    video.setAttribute("playsinline", "");

    return video;
  }

  function getPlayer() {
    if (available.length) {
      return available.pop();
    }

    if (active.size < MAX_PLAYERS) {
      return makePlayer();
    }

    return null;
  }

  function releasePlayer(card) {
    const video = active.get(card);
    if (!video) return;

    video.pause();
    video.removeAttribute("src");
    video.load();
    video.remove();

    active.delete(card);
    available.push(video);
  }

  function attachPlayer(card) {
    if (active.has(card)) return;

    const video = getPlayer();
    if (!video) return;

    video.src = "videos/" + card.dataset.filename;
    video.preload = "auto";

    card.appendChild(video);
    active.set(card, video);

    if (pageVisible) {
      video.play().catch(() => {});
    }
  }

  function getScrollOffset() {
    const transform = getComputedStyle(reel).transform;

    if (!transform || transform === "none") return 0;

    const matrix = new DOMMatrixReadOnly(transform);
    return matrix.m41;
  }

  function updatePlayers() {
    if (!pageVisible) return;

    const offset = getScrollOffset();
    const width = reelWindow.clientWidth;

    const needed = [];

    cards.forEach((card, index) => {
      const groupIndex = index % videoFiles.length;
      const groupNumber =
        Math.floor(index / videoFiles.length);

      const x =
        groupNumber * firstGroup.offsetWidth +
        groupIndex * CARD_STEP +
        offset;

      if (
        x + CARD_WIDTH >= -LOOKBEHIND &&
        x <= width + LOOKAHEAD
      ) {
        needed.push(card);
      }
    });

    const neededSet = new Set(needed);

    for (const card of active.keys()) {
      if (!neededSet.has(card)) {
        releasePlayer(card);
      }
    }

    // Prioritize cards closest to the visible window.
    needed.sort((a, b) => {
      const ar = a.getBoundingClientRect();
      const br = b.getBoundingClientRect();
      const wr = reelWindow.getBoundingClientRect();

      const da = Math.max(
        0,
        ar.left - wr.right,
        wr.left - ar.right
      );

      const db = Math.max(
        0,
        br.left - wr.right,
        wr.left - br.right
      );

      return da - db;
    });

    needed.forEach(attachPlayer);
  }

  function tick(timestamp) {
    if (!pageVisible) return;

    // Update player allocation approximately 10 times/s.
    if (timestamp - lastFrame > 100) {
      updatePlayers();
      lastFrame = timestamp;
    }

    frameId = requestAnimationFrame(tick);
  }

  function setVisible(visible) {
    if (pageVisible === visible) return;

    pageVisible = visible;

    if (visible) {
      reel.classList.add("running");

      updatePlayers();

      active.forEach(video => {
        video.play().catch(() => {});
      });

      lastFrame = 0;
      frameId = requestAnimationFrame(tick);
    } else {
      reel.classList.remove("running");

      if (frameId !== null) {
        cancelAnimationFrame(frameId);
        frameId = null;
      }

      active.forEach(video => video.pause());
    }
  }

  // Detect visibility of the iframe/reel in its viewport.
  const visibilityObserver = new IntersectionObserver(
    entries => {
      setVisible(
        entries.some(entry => entry.isIntersecting)
        && !document.hidden
      );
    },
    { threshold: 0.01 }
  );

  visibilityObserver.observe(reelWindow);

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      setVisible(false);
    } else {
      const rect = reelWindow.getBoundingClientRect();

      setVisible(
        rect.bottom > 0 &&
        rect.top < window.innerHeight
      );
    }
  });

  window.addEventListener("pagehide", () => {
    setVisible(false);
  });
</script>

</body>
</html>
