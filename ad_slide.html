
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commercial Work</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .page {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }

    .title {
      width: min(1100px, 100%);
      margin: 0 auto 35px;
      font-size: clamp(16px, 1.2vw, 24px);
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #fff;
    }

    .reel-window {
      position: relative;
      width: 1100px;
      max-width: 100%;
      height: 160px;
      margin: 0 auto;
      overflow: hidden;
      background: #000;

      -webkit-mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
      );

      mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
      );
    }

    .reel {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      width: 100%;
      height: 160px;
      padding: 5px 0;
      background: #000;
    }

    .video-card {
      position: relative;
      min-width: 0;
      height: 150px;
      overflow: hidden;
      background: #000;
    }

    .video-card video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s linear;
    }

    .video-card video.visible {
      opacity: 1;
    }

    @media (max-width: 900px) {
      .reel-window {
        -webkit-mask-image: linear-gradient(
          to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        );

        mask-image: linear-gradient(
          to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        );
      }
    }

    body.compact .page {
      align-items: center;
      justify-content: center;
    }

    body.compact .title {
      display: none;
    }

    html:has(body.compact),
    body.compact,
    body.compact .page {
      background: transparent;
    }
  </style>
</head>

<body>

<script>
  if (
    new URLSearchParams(location.search).get("mode")
    === "compact"
  ) {
    document.body.classList.add("compact");
  }
</script>

<main class="page">
  <div class="title">Commercial Work</div>

  <div class="reel-window" id="reel-window">
    <div class="reel">
      <div class="video-card"></div>
      <div class="video-card"></div>
      <div class="video-card"></div>
    </div>
  </div>
</main>

<script>
  const videoFiles = [
    "A1_Forsvaret3.mp4",
    "A2_Postnord1.mp4",
    "A3_Electrolux.mp4",
    "A5_Postnord5.mp4",
    "A6_Forsvaret1.mp4",
    "A7_Estrid.mp4",
    "A8_Postnord3.mp4",
    "A9_storytell.mp4",
    "AB1_forsvaret4.mp4",
    "AB2_st1.mp4",
    "AB3_RedCross.mp4",
    "AB4_Postnord7.mp4",
    "AB5_Netonnet.mp4",
    "AB6_Postnord4.mp4",
    "AB7_CocaCola.mp4",
    "AB8_Postnord6.mp4",
    "AB9_Forsvaret2.mp4",
    "ABC1_Postnord2.mp4"
  ];

  const cards = [
    ...document.querySelectorAll(".video-card")
  ];

  const reelWindow = document.getElementById("reel-window");

  const FADE_MS = 1000;
  const MIN_HOLD_MS = 3000;
  const MAX_HOLD_MS = 5000;
  const LOAD_TIMEOUT_MS = 8000;

  const slots = cards.map(card => ({
    card,
    current: null,
    next: null,
    timer: null,
    changing: false,
    version: 0
  }));

  let running = false;

  function random(min, max) {
    return min + Math.random() * (max - min);
  }

  function pickRandom(array) {
    return array[Math.floor(Math.random() * array.length)];
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function usedFilenames() {
    const used = new Set();

    slots.forEach(slot => {
      if (slot.current) {
        used.add(slot.current.dataset.filename);
      }

      if (slot.next) {
        used.add(slot.next.dataset.filename);
      }
    });

    return used;
  }

  function chooseFilename() {
    const used = usedFilenames();

    const choices = videoFiles.filter(
      filename => !used.has(filename)
    );

    return choices.length ? pickRandom(choices) : null;
  }

  function makeVideo(filename) {
    const video = document.createElement("video");

    video.dataset.filename = filename;
    video.src = "videos/" + filename;

    video.muted = true;
    video.defaultMuted = true;
    video.playsInline = true;
    video.loop = true;
    video.preload = "auto";

    video.setAttribute("muted", "");
    video.setAttribute("playsinline", "");
    video.setAttribute("loop", "");

    return video;
  }

  function waitForEvent(video, eventName) {
    return new Promise((resolve, reject) => {
      let timeout;

      function cleanup() {
        clearTimeout(timeout);
        video.removeEventListener(eventName, success);
        video.removeEventListener("error", failure);
      }

      function success() {
        cleanup();
        resolve();
      }

      function failure() {
        cleanup();
        reject(new Error("Failed to load " + video.src));
      }

      video.addEventListener(
        eventName,
        success,
        { once: true }
      );

      video.addEventListener(
        "error",
        failure,
        { once: true }
      );

      timeout = setTimeout(() => {
        cleanup();
        reject(new Error("Timeout: " + video.src));
      }, LOAD_TIMEOUT_MS);
    });
  }

  async function prepareVideo(video) {
    video.load();

    if (video.readyState < 1) {
      await waitForEvent(video, "loadedmetadata");
    }

    const duration = video.duration;

    if (
      Number.isFinite(duration) &&
      duration > 1
    ) {
      const maxStart = Math.max(
        0,
        duration - 6
      );

      const position = random(0, maxStart);

      if (position > 0.05) {
        const seekPromise = waitForEvent(
          video,
          "seeked"
        );

        video.currentTime = position;

        await seekPromise;
      }
    }

    if (video.readyState < 2) {
      await waitForEvent(video, "loadeddata");
    }
  }

  function destroyVideo(video) {
    if (!video) return;

    video.pause();
    video.removeAttribute("src");
    video.load();
    video.remove();
  }

  async function createPreparedVideo(slot) {
    if (!running || slot.next) return null;

    const filename = chooseFilename();

    if (!filename) return null;

    const video = makeVideo(filename);

    slot.next = video;
    video.style.zIndex = "2";
    slot.card.appendChild(video);

    try {
      await prepareVideo(video);

      if (!running || slot.next !== video) {
        return null;
      }

      return video;

    } catch (error) {
      console.warn(
        "Video preparation failed:",
        filename,
        error
      );

      if (slot.next === video) {
        slot.next = null;
      }

      destroyVideo(video);

      return null;
    }
  }

  function scheduleChange(slot) {
    clearTimeout(slot.timer);

    slot.timer = setTimeout(
      () => changeVideo(slot),
      random(MIN_HOLD_MS, MAX_HOLD_MS)
    );
  }

  async function changeVideo(slot) {
    if (!running || slot.changing) return;

    slot.changing = true;
    const version = ++slot.version;

    try {
      let next = slot.next;

      if (!next) {
        next = await createPreparedVideo(slot);
      }

      if (!next) return;

      if (!running || version !== slot.version) {
        return;
      }

      if (next.readyState < 2) {
        await waitForEvent(next, "loadeddata");
      }

      await next.play();

      if (!running || version !== slot.version) {
        return;
      }

      // The previous video remains visible
      // until the new video is playing.
      next.classList.add("visible");

      await sleep(FADE_MS + 50);

      if (!running || version !== slot.version) {
        return;
      }

      const previous = slot.current;

      slot.current = next;
      slot.next = null;

      destroyVideo(previous);

    } catch (error) {
      console.warn("Video switch failed:", error);

    } finally {
      slot.changing = false;

      if (running && version === slot.version) {
        scheduleChange(slot);
        createPreparedVideo(slot);
      }
    }
  }

  function start() {
    if (running) return;

    running = true;

    // Start all three slots immediately.
    slots.forEach(slot => {
      if (slot.current) {
        slot.current.play().catch(console.warn);

        scheduleChange(slot);
        createPreparedVideo(slot);
      } else {
        changeVideo(slot);
      }
    });
  }

  function stop() {
    if (!running) return;

    running = false;

    slots.forEach(slot => {
      clearTimeout(slot.timer);
      slot.version++;

      if (slot.current) {
        slot.current.pause();
      }

      if (slot.next) {
        destroyVideo(slot.next);
        slot.next = null;
      }
    });
  }

  // Start immediately when the document loads.
  start();

  document.addEventListener(
    "visibilitychange",
    () => {
      if (document.hidden) {
        stop();
      } else {
        start();
      }
    }
  );

  window.addEventListener("pagehide", stop);
</script>

</body>
</html>
