
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commercial Work</title>

  <style>
    /* ===== GLOBAL ===== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* ===== PAGE ===== */

    .page {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }

    .title {
      width: min(1100px, 100%);
      margin: 0 auto 35px;
      font-size: clamp(16px, 1.2vw, 24px);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
    }

    /* ===== VIDEO WINDOW ===== */

    .reel-window {
      position: relative;
      width: 1100px;
      max-width: 100%;
      height: 160px;
      margin: 0 auto;
      overflow: hidden;
      background: #000;

      -webkit-mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
      );

      mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
      );
    }

    /* ===== MOVING REEL ===== */

    .reel {
      display: flex;
      width: max-content;
      height: 160px;

      /* Adjusted for smaller videos */
      animation: scroll 131s linear infinite;

      will-change: transform;
    }

    .reel:hover {
      animation-play-state: paused;
    }

    .reel-group {
      display: flex;
      align-items: center;
      height: 160px;
      gap: 4px;
      padding-right: 4px;
      flex-shrink: 0;
      background: #000;
    }

    /* ===== VIDEOS ===== */

    .video-card {
      position: relative;
      width: calc(150px * 16 / 9);
      height: 150px;
      aspect-ratio: 16 / 9;
      flex-shrink: 0;
      overflow: hidden;
      background: #000;
      border: 0;
    }

    .video-card video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 0;
      pointer-events: none;
    }

    /* ===== INFINITE SCROLL ===== */

    @keyframes scroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    /* ===== MOBILE ===== */

    @media (max-width: 900px) {

      .reel {
        animation-duration: 109s;
      }

      .reel-window {
        -webkit-mask-image: linear-gradient(
          to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        );

        mask-image: linear-gradient(
          to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        );
      }
    }

    /* ===== COMPACT MODE ===== */

    body.compact .page {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body.compact .title {
      display: none;
    }

    body.compact .reel-window {
      width: 1100px;
      max-width: 100%;
      height: 160px;
      margin: 0 auto;
      background: #000;
    }

    body.compact .reel,
    body.compact .reel-group {
      height: 160px;
    }

    body.compact .video-card {
      width: calc(150px * 16 / 9);
      height: 150px;
      aspect-ratio: 16 / 9;
    }

    body.compact .reel:hover {
      animation-play-state: running;
    }

    /* Transparent surrounding area in compact mode */

    html:has(body.compact),
    body.compact,
    body.compact .page {
      background: transparent;
    }
  </style>
</head>

<body>

  <script>
    // Activate compact mode when embedded in portfolio
    if (
      new URLSearchParams(window.location.search)
        .get("mode") === "compact"
    ) {
      document.body.classList.add("compact");
    }
  </script>

  <main class="page">

    <div class="title">
      Commercial Work
    </div>

    <div class="reel-window">

      <div class="reel" id="reel">

        <!-- Original video sequence -->
        <div class="reel-group" id="first-group"></div>

        <!-- Duplicate sequence for seamless scrolling -->
        <div
          class="reel-group"
          id="second-group"
          aria-hidden="true"
        ></div>

      </div>

    </div>

  </main>

  <script>
    /* ===== VIDEO FILES ===== */

    const videoFiles = [
      "A1_Forsvaret3.mp4",
      "A2_Postnord1.mp4",
      "A3_Electrolux.mp4",
      "A5_Postnord5.mp4",
      "A6_Forsvaret1.mp4",
      "A7_Estrid.mp4",
      "A8_Postnord3.mp4",
      "A9_storytell.mp4",
      "AB1_forsvaret4.mp4",
      "AB2_st1.mp4",
      "AB3_RedCross.mp4",
      "AB4_Postnord7.mp4",
      "AB5_Netonnet.mp4",
      "AB6_Postnord4.mp4",
      "AB7_CocaCola.mp4",
      "AB8_Postnord6.mp4",
      "AB9_Forsvaret2.mp4",
      "ABC1_Postnord2.mp4"
    ];

    /* ===== BUILD VIDEO GROUPS ===== */

    const firstGroup =
      document.getElementById("first-group");

    const secondGroup =
      document.getElementById("second-group");

    function createVideoCard(filename) {

      const card = document.createElement("div");
      card.className = "video-card";

      const video = document.createElement("video");

      video.src = "videos/" + filename;

      video.autoplay = true;
      video.muted = true;
      video.defaultMuted = true;
      video.loop = true;
      video.playsInline = true;

      video.setAttribute("muted", "");
      video.setAttribute("autoplay", "");
      video.setAttribute("loop", "");
      video.setAttribute("playsinline", "");

      video.preload = "metadata";

      card.appendChild(video);

      return card;
    }

    /* ===== INSERT VIDEOS ===== */

    videoFiles.forEach(filename => {

      firstGroup.appendChild(
        createVideoCard(filename)
      );

      secondGroup.appendChild(
        createVideoCard(filename)
      );

    });

    /* ===== START PLAYBACK ===== */

    const videos =
      document.querySelectorAll(".video-card video");

    videos.forEach(video => {

      video.play().catch(() => {
        // Browser may delay autoplay
      });

    });

    /* ===== PAUSE OFFSCREEN VIDEOS ===== */

    const observer = new IntersectionObserver(
      entries => {

        entries.forEach(entry => {

          const video =
            entry.target.querySelector("video");

          if (!video) return;

          if (entry.isIntersecting) {

            video.play().catch(() => {});

          } else {

            video.pause();

          }

        });

      },
      {
        root: document.querySelector(".reel-window"),
        rootMargin: "400px 0px",
        threshold: 0
      }
    );

    document.querySelectorAll(".video-card")
      .forEach(card => observer.observe(card));

  </script>

</body>
</html>
