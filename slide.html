<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commercial Reel Test</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .page {
      width: 100vw;
      height: 100vh;

      display: flex;
      flex-direction: column;
      justify-content: center;

      overflow: hidden;
      background: #ffffff;
    }

    .title {
      margin-left: 6vw;
      margin-bottom: 35px;

      font-size: clamp(16px, 1.2vw, 24px);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;

      color: #222;
    }

    /*
      The viewport hides everything outside the screen.
    */
    .reel-window {
      width: 100%;
      overflow: hidden;
    }

    /*
      Two identical groups are placed next to each other.
      Moving exactly one group width creates the infinite loop.
    */
    .reel {
      display: flex;
      width: max-content;

      animation: scroll 60s linear infinite;
      will-change: transform;
    }

    .reel:hover {
      animation-play-state: paused;
    }

    .reel-group {
      display: flex;
      gap: 24px;
      padding-right: 24px;
    }

    .video-card {
      position: relative;

      width: 560px;
      aspect-ratio: 16 / 9;

      flex-shrink: 0;

      background: #111;
      overflow: hidden;
    }

    .video-card iframe {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
      pointer-events: none;
    }

    @keyframes scroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    @media (max-width: 900px) {
      .video-card {
        width: 70vw;
      }

      .reel {
        animation-duration: 50s;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="title">
      Commercial Work
    </div>

    <div class="reel-window">

      <div class="reel">

        <!-- FIRST COPY -->
        <div class="reel-group">

          <!-- YouTube 1 -->
          <div class="video-card">
            <iframe
              src="https://www.youtube.com/embed/Ltfmp5kHeuo?autoplay=1&mute=1&loop=1&playlist=Ltfmp5kHeuo&controls=0&modestbranding=1&rel=0"
              allow="autoplay; encrypted-media"
              allowfullscreen>
            </iframe>
          </div>

          <!-- Vimeo 1 -->
          <div class="video-card">
            <iframe
              src="https://player.vimeo.com/video/761787230?autoplay=1&muted=1&loop=1&background=1"
              allow="autoplay; fullscreen"
              allowfullscreen>
            </iframe>
          </div>

          <!-- Vimeo 2 -->
          <div class="video-card">
            <iframe
              src="https://player.vimeo.com/video/808499082?autoplay=1&muted=1&loop=1&background=1"
              allow="autoplay; fullscreen"
              allowfullscreen>
            </iframe>
          </div>

          <!-- YouTube 2 -->
          <div class="video-card">
            <iframe
              src="https://www.youtube.com/embed/FioBWppmfa4?autoplay=1&mute=1&loop=1&playlist=FioBWppmfa4&controls=0&modestbranding=1&rel=0"
              allow="autoplay; encrypted-media"
              allowfullscreen>
            </iframe>
          </div>

          <!-- YouTube 3 -->
          <div class="video-card">
            <iframe
              src="https://www.youtube.com/embed/EmmtT55uu_o?autoplay=1&mute=1&loop=1&playlist=EmmtT55uu_o&controls=0&modestbranding=1&rel=0"
              allow="autoplay; encrypted-media"
              allowfullscreen>
            </iframe>
          </div>

        </div>


        <!-- SECOND COPY FOR SEAMLESS LOOP -->
        <div class="reel-group" aria-hidden="true">

          <div class="video-card">
            <iframe
              src="https://www.youtube.com/embed/Ltfmp5kHeuo?autoplay=1&mute=1&loop=1&playlist=Ltfmp5kHeuo&controls=0&modestbranding=1&rel=0"
              allow="autoplay; encrypted-media">
            </iframe>
          </div>

          <div class="video-card">
            <iframe
              src="https://player.vimeo.com/video/761787230?autoplay=1&muted=1&loop=1&background=1"
              allow="autoplay; fullscreen">
            </iframe>
          </div>

          <div class="video-card">
            <iframe
              src="https://player.vimeo.com/video/808499082?autoplay=1&muted=1&loop=1&background=1"
              allow="autoplay; fullscreen">
            </iframe>
          </div>

          <div class="video-card">
            <iframe
              src="https://www.youtube.com/embed/FioBWppmfa4?autoplay=1&mute=1&loop=1&playlist=FioBWppmfa4&controls=0&modestbranding=1&rel=0"
              allow="autoplay; encrypted-media">
            </iframe>
          </div>

          <div class="video-card">
            <iframe
              src="https://www.youtube.com/embed/EmmtT55uu_o?autoplay=1&mute=1&loop=1&playlist=EmmtT55uu_o&controls=0&modestbranding=1&rel=0"
              allow="autoplay; encrypted-media">
            </iframe>
          </div>

        </div>

      </div>

    </div>

  </main>

</body>
</html>
