
name: Deploy Portfolio and Reading App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Reading App dependencies
        working-directory: Readingcomprehensionapp-main
        run: npm install

      - name: Build Reading App
        working-directory: Readingcomprehensionapp-main
        run: npm run build

      - name: Assemble portfolio
        run: |
          mkdir -p _site
          cp -a ./*.html _site/
          cp -a ./*.png _site/
          cp -a ./*.pdf _site/
          mkdir -p _site/Readingcomprehensionapp-main
          cp -a Readingcomprehensionapp-main/build/. _site/Readingcomprehensionapp-main/
          touch _site/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
