<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Film Work</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;

      background: #000;
      font-family: Arial, sans-serif;
    }


    /* ==========================================
       PAGE
    ========================================== */

    .page {
      width: 100vw;
      height: 100vh;

      display: flex;
      flex-direction: column;
      justify-content: center;

      overflow: hidden;
      background: #000;
    }


    /* ==========================================
       TITLE
    ========================================== */

    .title {
      margin-left: 6vw;
      margin-bottom: 35px;

      font-size: clamp(16px, 1.2vw, 24px);
      font-weight: 500;

      letter-spacing: 0.08em;
      text-transform: uppercase;

      color: #fff;
    }


    /* ==========================================
       VIDEO WINDOW + SIDE FADES
    ========================================== */

    .reel-window {
      position: relative;

      width: 100%;
      overflow: hidden;

      -webkit-mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
      );

      mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
      );
    }


    /* ==========================================
       MOVING REEL
    ========================================== */

    .reel {
      display: flex;
      width: max-content;

      animation: scroll 120s linear infinite;

      will-change: transform;
    }


    .reel:hover {
      animation-play-state: paused;
    }


    /* ==========================================
       VIDEO GROUP
    ========================================== */

    .reel-group {
      display: flex;
      gap: 0;
      padding: 0;
    }


    /* ==========================================
       VIDEO
    ========================================== */

    .video-card {
      position: relative;

      width: 560px;
      aspect-ratio: 16 / 9;

      flex-shrink: 0;

      overflow: hidden;

      background: #000;

      border: 0;
      border-radius: 0;
    }


    .video-card iframe {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;

      pointer-events: none;
    }


    /* ==========================================
       INFINITE MOVEMENT
    ========================================== */

    @keyframes scroll {

      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }

    }


    /* ==========================================
       MOBILE
    ========================================== */

    @media (max-width: 900px) {

      .video-card {
        width: 70vw;
      }

      .reel {
        animation-duration: 100s;
      }

      .reel-window {

        -webkit-mask-image: linear-gradient(
          to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        );

        mask-image: linear-gradient(
          to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        );

      }

    }

  </style>
</head>
