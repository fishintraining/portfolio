  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* =========================
       PAGE
    ========================= */

    .page {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }

    /* =========================
       TITLE
    ========================= */

    .title {
      width: min(1500px, 100%);
      margin: 0 auto 35px;
      font-size: clamp(16px, 1.2vw, 24px);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
    }

    /* =========================
       VIDEO WINDOW + FADE
    ========================= */

    .reel-window {
      position: relative;
      width: 1500px;
      max-width: 100%;
      height: 225px;
      margin: 0 auto;
      overflow: hidden;

      -webkit-mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
      );

      mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
      );
    }

    /* =========================
       MOVING REEL
    ========================= */

    .reel {
      display: flex;
      width: max-content;
      height: 225px;
      animation: scroll 120s linear infinite;
      will-change: transform;
    }

    .reel:hover {
      animation-play-state: paused;
    }

    .reel-group {
      display: flex;
      height: 225px;
      gap: 0;
      padding: 0;
    }

    /* =========================
       VIDEOS
    ========================= */

    .video-card {
      position: relative;
      width: 400px;
      height: 225px;
      aspect-ratio: 16 / 9;
      flex-shrink: 0;
      overflow: hidden;
      background: #000;
      border: 0;
      border-radius: 0;
    }

    .video-card iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
    }

    /* =========================
       INFINITE MOVEMENT
    ========================= */

    @keyframes scroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 900px) {

      .reel {
        animation-duration: 100s;
      }

      .reel-window {
        -webkit-mask-image: linear-gradient(
          to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        );

        mask-image: linear-gradient(
          to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        );
      }
    }

    /* =========================
       COMPACT MODE
    ========================= */

    body.compact .page {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body.compact .title {
      display: none;
    }

    body.compact .reel-window {
      width: 1500px;
      max-width: 100%;
      height: 225px;
      margin: 0 auto;
    }

    body.compact .reel {
      height: 225px;
    }

    body.compact .reel-group {
      height: 225px;
    }

    body.compact .video-card {
      width: 400px;
      height: 225px;
      aspect-ratio: 16 / 9;
    }

    body.compact .reel:hover {
      animation-play-state: running;
    }

    /* =========================
       TRANSPARENT BACKGROUND
       IN COMPACT MODE
    ========================= */

    html:has(body.compact),
    body.compact,
    body.compact .page,
    body.compact .reel-window {
      background: transparent;
    }

  </style>
</head>
