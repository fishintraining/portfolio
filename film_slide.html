
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Work</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* =========================
       PAGE
    ========================= */

    .page {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }

    /* =========================
       TITLE
    ========================= */

    .title {
      width: min(1500px, 100%);
      margin: 0 auto 35px;
      font-size: clamp(16px, 1.2vw, 24px);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
    }

    /* =========================
       VIDEO WINDOW + FADE
    ========================= */

    .reel-window {
      position: relative;
      width: 1500px;
      max-width: 100%;
      height: 225px;
      margin: 0 auto;
      overflow: hidden;

      -webkit-mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
      );

      mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
      );
    }

    /* =========================
       MOVING REEL
    ========================= */

    .reel {
      display: flex;
      width: max-content;
      height: 225px;
      animation: scroll 210s linear infinite;
      will-change: transform;
    }

    .reel:hover {
      animation-play-state: paused;
    }

    .reel-group {
      display: flex;
      height: 225px;
      gap: 0;
      padding: 0;
      flex-shrink: 0;
    }

    /* =========================
       VIDEOS
    ========================= */

    .video-card {
      position: relative;
      width: 400px;
      height: 225px;
      aspect-ratio: 16 / 9;
      flex-shrink: 0;
      overflow: hidden;
      background: #000;
      border: 0;
      border-radius: 0;
    }

    .video-card video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 0;
      pointer-events: none;
    }

    /* =========================
       INFINITE MOVEMENT
    ========================= */

    @keyframes scroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 900px) {

      .reel {
        animation-duration: 175s;
      }

      .reel-window {
        -webkit-mask-image: linear-gradient(
          to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        );

        mask-image: linear-gradient(
          to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        );
      }
    }

    /* =========================
       COMPACT MODE
    ========================= */

    body.compact .page {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body.compact .title {
      display: none;
    }

    body.compact .reel-window {
      width: 1500px;
      max-width: 100%;
      height: 225px;
      margin: 0 auto;
    }

    body.compact .reel {
      height: 225px;
    }

    body.compact .reel-group {
      height: 225px;
    }

    body.compact .video-card {
      width: 400px;
      height: 225px;
      aspect-ratio: 16 / 9;
    }

    body.compact .reel:hover {
      animation-play-state: running;
    }

    /* =========================
       TRANSPARENT BACKGROUND
       IN COMPACT MODE
    ========================= */

    html:has(body.compact),
    body.compact,
    body.compact .page,
    body.compact .reel-window {
      background: transparent;
    }

  </style>
</head>

<body>

  <script>
    if (
      new URLSearchParams(window.location.search)
        .get("mode") === "compact"
    ) {
      document.body.classList.add("compact");
    }
  </script>

  <main class="page">

    <div class="title">
      Film & Television Work
    </div>

    <div class="reel-window">

      <div class="reel">

        <!-- FIRST GROUP -->
        <div class="reel-group" id="first-group">
        </div>

        <!-- SECOND IDENTICAL GROUP -->
        <div
          class="reel-group"
          id="second-group"
          aria-hidden="true">
        </div>

      </div>

    </div>

  </main>

  <script>

    /* =========================
       VIDEO FILES
       EXACT PLAYBACK ORDER
    ========================= */

    const videoFiles = [
      "F1_Bert.mp4",
      "F2_BarracudaQueens.mp4",
      "F3_IDH.mp4",
      "F4_Stormpalugngatan.mp4",
      "F5_Fartblinda.mp4",
      "F6_konferensen.mp4",
      "F7_VV.mp4",
      "F8_hassel.mp4",
      "F9_Maklarna.mp4",
      "FB1_ParadisCity.mp4",
      "FB2_Svartan.mp4",
      "FB3_vaka.mp4",
      "FB4_HappyPride.mp4",
      "FB5_Dystopia.mp4"
    ];

    /* =========================
       BUILD VIDEO GROUPS
    ========================= */

    const firstGroup =
      document.getElementById("first-group");

    const secondGroup =
      document.getElementById("second-group");

    function createVideoCard(filename) {

      const card = document.createElement("div");
      card.className = "video-card";

      const video = document.createElement("video");

      video.src = "videos/" + filename;

      video.autoplay = true;
      video.muted = true;
      video.defaultMuted = true;
      video.loop = true;
      video.playsInline = true;

      video.setAttribute("muted", "");
      video.setAttribute("autoplay", "");
      video.setAttribute("loop", "");
      video.setAttribute("playsinline", "");

      video.preload = "metadata";

      card.appendChild(video);

      return card;
    }

    /* =========================
       INSERT VIDEOS
    ========================= */

    videoFiles.forEach(filename => {

      firstGroup.appendChild(
        createVideoCard(filename)
      );

      secondGroup.appendChild(
        createVideoCard(filename)
      );

    });

    /* =========================
       START PLAYBACK
    ========================= */

    const videos =
      document.querySelectorAll(".video-card video");

    videos.forEach(video => {

      video.play().catch(() => {
        // Browser may delay playback until allowed.
      });

    });

    /* =========================
       PAUSE OFFSCREEN VIDEOS
       TO REDUCE RESOURCE USAGE
    ========================= */

    const observer = new IntersectionObserver(
      entries => {

        entries.forEach(entry => {

          const video =
            entry.target.querySelector("video");

          if (!video) return;

          if (entry.isIntersecting) {

            video.play().catch(() => {});

          } else {

            video.pause();

          }

        });

      },
      {
        root: document.querySelector(".reel-window"),
        rootMargin: "400px 0px",
        threshold: 0
      }
    );

    document.querySelectorAll(".video-card")
      .forEach(card => observer.observe(card));

  </script>

</body>
</html>
