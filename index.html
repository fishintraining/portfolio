<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Malin Hall — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --yellow: #f6b731;
      --green: #3f5909;
      --brown: #6b4937;
      --white: #ffffff;
      --black: #111111;
      --page-bg: #eef0f2;

      --padding: clamp(20px, 5vw, 80px);
      --max-width: 1500px;
    }


    /* =========================================
       RESET
    ========================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Manrope", sans-serif;
      background: var(--page-bg);
      color: var(--black);
    }


    /* =========================================
       HEADER
    ========================================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 var(--padding);

      background: var(--white);
      border-bottom: 1px solid var(--black);
    }

    .logo {
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      color: var(--black);
    }

    nav {
      display: flex;
      gap: clamp(20px, 3vw, 50px);
    }

    nav a {
      font-size: 14px;
      text-decoration: none;
      color: var(--black);
    }

    nav a:hover {
      opacity: 0.6;
    }


    /* =========================================
       HERO
    ========================================= */

    .hero {
      width: min(100% - 34px, 1500px);
      height: calc(100vh - 87px);

      min-height: 550px;

      margin: 17px auto 0;

      position: relative;

      display: grid;
      grid-template-columns: 45% 55%;

      overflow: hidden;

      background: var(--white);
    }


    /* =========================================
       LEFT SIDE
    ========================================= */

    .hero-left {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: visible;

      background: var(--white);

      z-index: 2;
    }


    /* =========================================
       RIGHT SIDE / PORTRAIT
    ========================================= */

    .hero-right {
      position: relative;

      overflow: hidden;

      background: var(--white);

      z-index: 1;
    }

    .hero-right img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      filter: grayscale(100%);
    }


    /* =========================================
       MAIN TEXT CIRCLE
    ========================================= */

    .main-circle {
      position: absolute;

      width: min(310px, 70%);

      aspect-ratio: 1;

      left: 17%;
      top: 11%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      border-radius: 50%;

      background: var(--green);

      z-index: 20;
    }

    .main-circle p {
      max-width: 290px;

      font-size: clamp(10px, 1vw, 14px);
      line-height: 1.25;

      font-weight: 700;

      text-align: center;

      color: white;
    }


    /* =========================================
       BUBBLE BASE
    ========================================= */

    .bubble {
      position: absolute;

      aspect-ratio: 1;

      border-radius: 50%;

      pointer-events: none;
    }

    .yellow {
      background: var(--yellow);
    }

    .green {
      background: var(--green);
    }


    /* =========================================
       LEFT BUBBLES
    ========================================= */

    .left-yellow-large {
      width: 355px;

      max-width: 80%;

      top: 4%;
      left: 8%;

      opacity: 0.52;

      z-index: 10;
    }

    .left-green-top {
      width: 105px;

      top: 3%;
      left: 70%;

      opacity: 0.62;

      z-index: 11;
    }

    .left-yellow-small {
      width: 40px;

      top: 14%;
      left: 88%;

      opacity: 0.72;

      z-index: 12;
    }

    .left-yellow-tiny {
      width: 25px;

      top: 20%;
      left: 80%;

      opacity: 0.70;

      z-index: 12;
    }

    .left-green-bottom {
      width: 105px;

      top: 60%;
      left: 88%;

      opacity: 0.62;

      z-index: 12;
    }

    .left-yellow-bottom {
      width: 105px;

      top: 67%;
      left: 81%;

      opacity: 0.58;

      z-index: 11;
    }

    .left-yellow-dot {
      width: 27px;

      top: 79%;
      left: 111%;

      opacity: 0.70;

      z-index: 13;
    }


    /* =========================================
       RIGHT BUBBLES
    ========================================= */

    .right-yellow-top {
      width: 140px;

      top: -7%;
      left: 60%;

      opacity: 0.52;

      z-index: 10;
    }

    .right-green-top {
      width: 105px;

      top: 4%;
      right: 3%;

      opacity: 0.92;

      z-index: 12;
    }

    .right-green-middle {
      width: 105px;

      top: 18%;
      left: 60%;

      opacity: 0.58;

      z-index: 11;
    }

    .right-yellow-middle {
      width: 85px;

      top: 35%;
      right: 5%;

      opacity: 0.28;

      z-index: 10;
    }

    .right-yellow-dot {
      width: 27px;

      top: 24%;
      right: 2%;

      opacity: 0.55;

      z-index: 12;
    }

    .right-green-dot {
      width: 19px;

      top: 39%;
      right: 10%;

      opacity: 0.92;

      z-index: 13;
    }

    .right-green-bottom {
      width: 190px;

      bottom: -10%;
      right: -2%;

      opacity: 0.86;

      z-index: 11;
    }

    .right-yellow-bottom {
      width: 90px;

      bottom: 23%;
      right: 0%;

      opacity: 0.62;

      z-index: 12;
    }

    .right-yellow-small {
      width: 27px;

      bottom: 31%;
      right: 19%;

      opacity: 0.72;

      z-index: 13;
    }

    .right-green-small {
      width: 18px;

      bottom: 32%;
      right: 18%;

      opacity: 0.88;

      z-index: 14;
    }


    /* =========================================
       TABLET
    ========================================= */

    @media (max-width: 900px) {

      .hero {
        width: calc(100% - 24px);

        height: auto;
        min-height: 850px;

        grid-template-columns: 1fr;
      }

      .hero-left {
        min-height: 430px;
      }

      .hero-right {
        min-height: 500px;
      }

      .main-circle {
        left: 20%;
        top: 10%;
      }

    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

      header {
        height: 60px;
      }

      nav {
        gap: 15px;
      }

      nav a {
        font-size: 12px;
      }

      .hero {
        width: calc(100% - 16px);

        margin-top: 8px;
      }

      .hero-left {
        min-height: 360px;
      }

      .hero-right {
        min-height: 430px;
      }

      .main-circle {
        width: 250px;

        left: 14%;
        top: 9%;
      }

      .left-yellow-large {
        width: 285px;
      }

      .left-green-top {
        width: 75px;
      }

      .left-yellow-small {
        width: 32px;
      }

      .left-green-bottom {
        width: 75px;
      }

      .left-yellow-bottom {
        width: 75px;
      }

      .right-yellow-top {
        width: 110px;
      }

      .right-green-top {
        width: 85px;
      }

      .right-green-middle {
        width: 85px;
      }

      .right-green-bottom {
        width: 145px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       HEADER
  ========================================= -->

  <header>

    <a href="#" class="logo">
      Malin Hall
    </a>

    <nav>
      <a href="#work">Work</a>
      <a href="#about">About me</a>
      <a href="#contact">Contact</a>
    </nav>

  </header>


  <!-- =========================================
       HERO
  ========================================= -->

  <main>

    <section class="hero">


      <!-- =====================================
           LEFT
      ====================================== -->

      <div class="hero-left">


        <!-- Large yellow background bubble -->

        <div class="bubble yellow left-yellow-large"></div>


        <!-- Small bubbles -->

        <div class="bubble green left-green-top"></div>

        <div class="bubble yellow left-yellow-small"></div>

        <div class="bubble yellow left-yellow-tiny"></div>


        <!-- Bottom cluster -->

        <div class="bubble green left-green-bottom"></div>

        <div class="bubble yellow left-yellow-bottom"></div>

        <div class="bubble yellow left-yellow-dot"></div>


        <!-- Main text circle -->

        <div class="main-circle">

          <p>
            Digital production · UX/HCI · Technical systems
          </p>

        </div>


      </div>


      <!-- =====================================
           RIGHT / PORTRAIT
      ====================================== -->

      <div class="hero-right">

        <img
          src="portrait_malin.png"
          alt="Portrait of Malin Hall"
        >


        <!-- Top bubbles -->

        <div class="bubble yellow right-yellow-top"></div>

        <div class="bubble green right-green-top"></div>


        <!-- Middle bubbles -->

        <div class="bubble green right-green-middle"></div>

        <div class="bubble yellow right-yellow-middle"></div>

        <div class="bubble yellow right-yellow-dot"></div>

        <div class="bubble green right-green-dot"></div>


        <!-- Bottom bubbles -->

        <div class="bubble green right-green-bottom"></div>

        <div class="bubble yellow right-yellow-bottom"></div>

        <div class="bubble yellow right-yellow-small"></div>

        <div class="bubble green right-green-small"></div>

      </div>


    </section>

  </main>


</body>
</html>
