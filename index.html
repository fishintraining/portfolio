<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <title>Malin Hall — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"

  <style>

    :root {
      --yellow: #f6b731;
      --green: #3f5909;
      --brown: #6b4937;
      --white: #ffffff;
      --black: #111111;

      --padding: clamp(20px, 5vw, 80px);
      --max-width: 1500px;
    }


    /* =========================================
       RESET
    ========================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Manrope", sans-serif;
      background: var(--white);
      color: var(--black);
    }


    /* =========================================
       HEADER
    ========================================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 var(--padding);

      background: var(--white);
      border-bottom: 1px solid var(--black);
    }

    .logo {
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      color: var(--black);
    }

    nav {
      display: flex;
      gap: clamp(20px, 3vw, 50px);
    }

    nav a {
      font-size: 14px;
      text-decoration: none;
      color: var(--black);
    }

    nav a:hover {
      opacity: 0.6;
    }


    /* =========================================
       GENERAL
    ========================================= */

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 var(--padding);
    }


    /* =========================================
       HERO
    ========================================= */

    .hero {
      min-height: calc(100vh - 70px);

      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .hero-left {
      min-height: calc(100vh - 70px);

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: var(--padding);
    }

    .hero-eyebrow {
      margin-bottom: 28px;

      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;

      color: var(--green);
    }

    .hero-title {
      display: none;
    }

    .hero-description {
      max-width: 560px;

      font-size: clamp(22px, 3vw, 42px);
      line-height: 1.15;
      font-weight: 500;
    }

    .hero-scroll {
      margin-top: 50px;

      font-size: 13px;
      font-weight: 600;

      text-decoration: none;
      color: var(--black);
    }


    /* =========================================
       HERO BUBBLES
    ========================================= */

    .hero-image {
      min-height: calc(100vh - 70px);

      position: relative;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow: hidden;

      background: var(--white);

      border-left: 1px solid var(--black);
    }

    .bubble {
      position: absolute;

      aspect-ratio: 1;

      border-radius: 50%;
    }

    .bubble-yellow {
      background: var(--yellow);
    }

    .bubble-green {
      background: var(--green);
    }

    .bubble-brown {
      background: var(--brown);
    }


    /* =========================================
       BUBBLES
       SIZE + OPACITY FOLLOW A BELL CURVE
    ========================================= */

    /* =========================================
       SPECIAL BUBBLES
    ========================================= */

    .bubble-special {
      background: transparent;
      border: 3px solid var(--yellow);
    }

    .bubble-special::after {
      content: "";

      position: absolute;

      width: 68%;
      height: 68%;

      top: 16%;
      left: 16%;

      border-radius: 50%;

      background: var(--green);

      opacity: 0.55;
    }

    .bubble-special-brown {
      background: transparent;
      border: 3px solid var(--brown);
    }

    .bubble-special-brown::after {
      content: "";

      position: absolute;

      width: 62%;
      height: 62%;

      top: 19%;
      left: 19%;

      border-radius: 50%;

      background: var(--yellow);

      opacity: 0.58;
    }

    .bubble-special-green {
      background: transparent;
      border: 3px solid var(--green);
    }

    .bubble-special-green::after {
      content: "";

      position: absolute;

      width: 64%;
      height: 64%;

      top: 18%;
      left: 18%;

      border-radius: 50%;

      background: var(--brown);

      opacity: 0.55;
    }


    /* =========================================
       SPECIAL BUBBLE POSITIONS
    ========================================= */

    .bubble-13 {
      width: 17%;
      top: 18%;
      left: 43%;
      opacity: 0.75;
      z-index: 2;
    }

    .bubble-14 {
      width: 13%;
      bottom: 27%;
      left: 34%;
      opacity: 0.70;
      z-index: 2;
    }

    .bubble-15 {
      width: 11%;
      top: 59%;
      right: 20%;
      opacity: 0.72;
      z-index: 2;
    }


    /* =========================================
       PORTRAIT
    ========================================= */

    .portrait-bubble {
      position: relative;
      z-index: 5;

      width: min(55%, 420px);
      aspect-ratio: 1;

      border-radius: 50%;

      overflow: hidden;

      background: var(--brown);

      border: clamp(7px, 1vw, 12px) solid white;

      box-shadow: 14px 14px 0 var(--green);
    }

    .portrait-bubble img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }


    /* =========================================
       TABLET
    ========================================= */

    @media (max-width: 900px) {

      .hero {
        grid-template-columns: 1fr;
      }

      .hero-left {
        min-height: 50vh;
      }

      .hero-image {
        min-height: 70vh;

        border-left: none;
        border-top: 1px solid var(--black);
      }

      .portrait-bubble {
        width: min(55%, 380px);
      }

    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

      header {
        height: 60px;
      }

      nav {
        gap: 15px;
      }

      nav a {
        font-size: 12px;
      }

      .hero-left {
        min-height: 55vh;
      }

      .hero-description {
        font-size: clamp(24px, 7vw, 34px);
      }

      .hero-image {
        min-height: 65vh;
      }

      .portrait-bubble {
        width: 58vw;

        box-shadow: 9px 10px 0 var(--green);
      }

    }

  </style>

</head>
