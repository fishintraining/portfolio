<!DOCTYPE html>

<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Malin Hall — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --yellow: #f6b731;
      --green: #3f5909;
      --brown: #6b4937;
      --white: #ffffff;
      --black: #111111;

      --padding: clamp(20px, 5vw, 80px);
      --max-width: 1500px;
    }


    /* =========================================
       RESET
    ========================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Manrope", sans-serif;
      background: var(--white);
      color: var(--black);
    }


    /* =========================================
       HEADER
    ========================================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 var(--padding);

      background: var(--white);
      border-bottom: 1px solid var(--black);
    }

    .logo {
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      color: var(--black);
    }

    nav {
      display: flex;
      gap: clamp(20px, 3vw, 50px);
    }

    nav a {
      font-size: 14px;
      text-decoration: none;
      color: var(--black);
    }

    nav a:hover {
      opacity: 0.6;
    }


    /* =========================================
       GENERAL
    ========================================= */

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 var(--padding);
    }


    /* =========================================
       HERO
    ========================================= */

    .hero {
      min-height: calc(100vh - 70px);

      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .hero-left {
      min-height: calc(100vh - 70px);

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: var(--padding);
    }

    .hero-eyebrow {
      margin-bottom: 28px;

      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;

      color: var(--green);
    }

    .hero-title {
      display: none;
    }

    .hero-description {
      max-width: 560px;

      font-size: clamp(22px, 3vw, 42px);
      line-height: 1.15;
      font-weight: 500;
    }

    .hero-scroll {
      margin-top: 50px;

      font-size: 13px;
      font-weight: 600;

      text-decoration: none;
      color: var(--black);
    }


    /* =========================================
       HERO BUBBLES
    ========================================= */

    .hero-image {
      min-height: calc(100vh - 70px);

      position: relative;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow: hidden;

      background: var(--white);

      border-left: 1px solid var(--black);
    }

    .bubble {
      position: absolute;

      aspect-ratio: 1;

      border-radius: 50%;

      z-index: 2;
    }

    .bubble-yellow {
      background: var(--yellow);
    }

    .bubble-green {
      background: var(--green);
    }

    .bubble-brown {
      background: var(--brown);
    }


    /* =========================================
       BLACK & WHITE PORTRAIT
       ONE IMAGE SPREAD ACROSS ALL BUBBLES
    ========================================= */

    .bubble-portrait {
      position: absolute;

      inset: 0;

      z-index: 1;

      background-image: url("portrait_malin.png");

      background-size: cover;
      background-position: center;

      filter: grayscale(100%);

      -webkit-mask-image:
        radial-gradient(circle 12% at 30% 26%, #000 99%, transparent 100%),
        radial-gradient(circle 9% at 61% 19%, #000 99%, transparent 100%),
        radial-gradient(circle 17% at 94% 42%, #000 99%, transparent 100%),
        radial-gradient(circle 10.5% at 23% 84%, #000 99%, transparent 100%),
        radial-gradient(circle 14% at 76% 103%, #000 99%, transparent 100%),
        radial-gradient(circle 7.5% at 69% 67%, #000 99%, transparent 100%),
        radial-gradient(circle 6% at 8% 48%, #000 99%, transparent 100%),
        radial-gradient(circle 5% at 45% 29%, #000 99%, transparent 100%),
        radial-gradient(circle 4.5% at 91% 57%, #000 99%, transparent 100%),
        radial-gradient(circle 6.5% at 34% 66%, #000 99%, transparent 100%),
        radial-gradient(circle 4% at 62% 80%, #000 99%, transparent 100%),
        radial-gradient(circle 3.5% at 16% 72%, #000 99%, transparent 100%),
        radial-gradient(circle 10% at 27% 44%, #000 99%, transparent 100%),
        radial-gradient(circle 8% at 54% 56%, #000 99%, transparent 100%),
        radial-gradient(circle 5.5% at 78% 25%, #000 99%, transparent 100%),
        radial-gradient(circle 7% at 43% 91%, #000 99%, transparent 100%),
        radial-gradient(circle 5% at 82% 61%, #000 99%, transparent 100%),
        radial-gradient(circle 3% at 19% 61%, #000 99%, transparent 100%),
        radial-gradient(circle 11% at 51% 13%, #000 99%, transparent 100%);

      mask-image:
        radial-gradient(circle 12% at 30% 26%, #000 99%, transparent 100%),
        radial-gradient(circle 9% at 61% 19%, #000 99%, transparent 100%),
        radial-gradient(circle 17% at 94% 42%, #000 99%, transparent 100%),
        radial-gradient(circle 10.5% at 23% 84%, #000 99%, transparent 100%),
        radial-gradient(circle 14% at 76% 103%, #000 99%, transparent 100%),
        radial-gradient(circle 7.5% at 69% 67%, #000 99%, transparent 100%),
        radial-gradient(circle 6% at 8% 48%, #000 99%, transparent 100%),
        radial-gradient(circle 5% at 45% 29%, #000 99%, transparent 100%),
        radial-gradient(circle 4.5% at 91% 57%, #000 99%, transparent 100%),
        radial-gradient(circle 6.5% at 34% 66%, #000 99%, transparent 100%),
        radial-gradient(circle 4% at 62% 80%, #000 99%, transparent 100%),
        radial-gradient(circle 3.5% at 16% 72%, #000 99%, transparent 100%),
        radial-gradient(circle 10% at 27% 44%, #000 99%, transparent 100%),
        radial-gradient(circle 8% at 54% 56%, #000 99%, transparent 100%),
        radial-gradient(circle 5.5% at 78% 25%, #000 99%, transparent 100%),
        radial-gradient(circle 7% at 43% 91%, #000 99%, transparent 100%),
        radial-gradient(circle 5% at 82% 61%, #000 99%, transparent 100%),
        radial-gradient(circle 3% at 19% 61%, #000 99%, transparent 100%),
        radial-gradient(circle 11% at 51% 13%, #000 99%, transparent 100%);

      -webkit-mask-composite: source-over;
      mask-composite: add;
    }


    /* =========================================
       BUBBLES
       SIZE + OPACITY FOLLOW A BELL CURVE
    ========================================= */

    .bubble-1 {
      width: 24%;
      top: 14%;
      left: 18%;
      opacity: 0.72;
      mix-blend-mode: multiply;
    }

    .bubble-2 {
      width: 18%;
      top: 10%;
      right: 23%;
      opacity: 0.52;
      mix-blend-mode: multiply;
    }

    .bubble-3 {
      width: 34%;
      top: 25%;
      right: -6%;
      opacity: 0.86;
      mix-blend-mode: multiply;
    }

    .bubble-4 {
      width: 21%;
      bottom: 16%;
      left: 11%;
      opacity: 0.62;
      mix-blend-mode: multiply;
    }

    .bubble-5 {
      width: 28%;
      bottom: -7%;
      right: 12%;
      opacity: 0.76;
      mix-blend-mode: multiply;
    }

    .bubble-6 {
      width: 15%;
      bottom: 25%;
      right: 19%;
      opacity: 0.42;
      mix-blend-mode: multiply;
    }

    .bubble-7 {
      width: 12%;
      top: 42%;
      left: 4%;
      opacity: 0.82;
      mix-blend-mode: multiply;
    }

    .bubble-8 {
      width: 10%;
      top: 24%;
      left: 35%;
      opacity: 0.34;
      mix-blend-mode: multiply;
    }

    .bubble-9 {
      width: 9%;
      top: 53%;
      right: 5%;
      opacity: 0.58;
      mix-blend-mode: multiply;
    }

    .bubble-10 {
      width: 13%;
      bottom: 34%;
      left: 23%;
      opacity: 0.48;
      mix-blend-mode: multiply;
    }

    .bubble-11 {
      width: 8%;
      bottom: 20%;
      right: 31%;
      opacity: 0.68;
      mix-blend-mode: multiply;
    }

    .bubble-12 {
      width: 7%;
      top: 66%;
      left: 9%;
      opacity: 0.27;
      mix-blend-mode: multiply;
    }

    .bubble-16 {
      width: 20%;
      top: 34%;
      left: 17%;
      opacity: 0.64;
      mix-blend-mode: multiply;
    }

    .bubble-17 {
      width: 16%;
      top: 48%;
      left: 31%;
      opacity: 0.74;
      mix-blend-mode: multiply;
    }

    .bubble-18 {
      width: 11%;
      top: 17%;
      right: 9%;
      opacity: 0.38;
      mix-blend-mode: multiply;
    }

    .bubble-19 {
      width: 14%;
      bottom: 10%;
      left: 29%;
      opacity: 0.56;
      mix-blend-mode: multiply;
    }

    .bubble-20 {
      width: 10%;
      bottom: 39%;
      right: 11%;
      opacity: 0.88;
      mix-blend-mode: multiply;
    }

    .bubble-21 {
      width: 6%;
      top: 58%;
      left: 13%;
      opacity: 0.22;
      mix-blend-mode: multiply;
    }

    .bubble-22 {
      width: 5%;
      top: 37%;
      right: 28%;
      opacity: 0.30;
      mix-blend-mode: multiply;
    }

    .bubble-23 {
      width: 22%;
      top: 9%;
      left: 29%;
      opacity: 0.92;
      mix-blend-mode: multiply;
    }


    /* =========================================
       PORTRAIT
    ========================================= */

    .portrait-bubble {
      display: none;
    }


    /* =========================================
       TABLET
    ========================================= */

    @media (max-width: 900px) {

      .hero {
        grid-template-columns: 1fr;
      }

      .hero-left {
        min-height: 50vh;
      }

      .hero-image {
        min-height: 70vh;

        border-left: none;
        border-top: 1px solid var(--black);
      }

    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

      header {
        height: 60px;
      }

      nav {
        gap: 15px;
      }

      nav a {
        font-size: 12px;
      }

      .hero-left {
        min-height: 55vh;
      }

      .hero-description {
        font-size: clamp(24px, 7vw, 34px);
      }

      .hero-image {
        min-height: 65vh;
      }

    }

  </style>

</head>

<body>

</body>
</html>
