<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Malin Hall — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --yellow: #f6b731;
      --green: #3f5909;
      --brown: #6b4937;
      --white: #ffffff;
      --black: #111111;

      --padding: clamp(20px, 5vw, 80px);
      --max-width: 1500px;
    }


    /* =========================================
       RESET
    ========================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Manrope", sans-serif;
      background: var(--white);
      color: var(--black);
    }


    /* =========================================
       HEADER
    ========================================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 var(--padding);

      background: var(--white);
      border-bottom: 1px solid var(--black);
    }

    .logo {
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      color: var(--black);
    }

    nav {
      display: flex;
      gap: clamp(20px, 3vw, 50px);
    }

    nav a {
      font-size: 14px;
      text-decoration: none;
      color: var(--black);
    }

    nav a:hover {
      opacity: 0.6;
    }


    /* =========================================
       GENERAL
    ========================================= */

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 var(--padding);
    }


    /* =========================================
       HERO
    ========================================= */

    .hero {
      min-height: calc(100vh - 70px);

      position: relative;

      display: grid;
      grid-template-columns: 1fr 1fr;

      overflow: hidden;
    }

    .hero-left {
      min-height: calc(100vh - 70px);

      position: relative;
      z-index: 10;

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: var(--padding);
    }

    .hero-eyebrow {
      margin-bottom: 28px;

      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;

      color: var(--green);
    }

    .hero-title {
      display: none;
    }

    .hero-description {
      max-width: 560px;

      font-size: clamp(22px, 3vw, 42px);
      line-height: 1.15;
      font-weight: 500;

      color: #444444;
    }

    .hero-scroll {
      margin-top: 50px;

      font-size: 13px;
      font-weight: 600;

      text-decoration: none;
      color: var(--black);
    }


    /* =========================================
       RIGHT IMAGE AREA
    ========================================= */

    .hero-image {
      min-height: calc(100vh - 70px);

      position: relative;
      z-index: 1;

      display: flex;

      justify-content: center;
      align-items: center;

      overflow: hidden;

      background: var(--white);

      border-left: 1px solid var(--black);
    }


    /* =========================================
       BLACK & WHITE PORTRAIT
       HALF-PAGE IMAGE
    ========================================= */

    .bubble-portrait {
      position: absolute;

      inset: 0;

      z-index: 1;

      background-image: url("portrait_malin.png");

      background-size: cover;
      background-position: center;

      filter: grayscale(100%);
    }


    /* =========================================
       BUBBLE FIELD
    ========================================= */

    .bubble-field {
      position: absolute;

      inset: 0;

      z-index: 5;

      pointer-events: none;
    }

    .bubble {
      position: absolute;

      aspect-ratio: 1;

      border-radius: 50%;

      mix-blend-mode: multiply;
    }

    .bubble-yellow {
      background: var(--yellow);
    }

    .bubble-green {
      background: var(--green);
    }

    .bubble-brown {
      background: var(--brown);
    }


    /* =========================================
       MAIN BUBBLES
       THE ONES FROM THE SKETCH
    ========================================= */

    /* LARGE GREEN — upper left */

    .bubble-main-1 {
      width: 36%;

      top: 5%;
      left: 6%;

      opacity: 0.90;
    }


    /* SMALL YELLOW — upper middle */

    .bubble-main-2 {
      width: 4.5%;

      top: 9%;
      left: 43%;

      opacity: 0.90;
    }


    /* GREEN — centre */

    .bubble-main-3 {
      width: 10%;

      top: 65%;
      left: 44%;

      opacity: 0.90;
    }


    /* YELLOW — centre lower */

    .bubble-main-4 {
      width: 10%;

      top: 77%;
      left: 40%;

      opacity: 0.90;
    }


    /* LARGE GREEN — lower right */

    .bubble-main-5 {
      width: 39%;

      top: 57%;
      right: 4%;

      opacity: 0.90;
    }


    /* YELLOW — above right green */

    .bubble-main-6 {
      width: 16%;

      top: 50%;
      right: 3%;

      opacity: 0.90;
    }


    /* =========================================
       EXTRA BUBBLES
       LARGEST CLOSE TO MAIN BUBBLES,
       SMALLER + FAINTER FURTHER AWAY
    ========================================= */

    /* Around upper-left green */

    .bubble-extra-1 {
      width: 23%;
      top: 1%;
      left: 13%;
      opacity: 0.68;
    }

    .bubble-extra-2 {
      width: 18%;
      top: 13%;
      left: 30%;
      opacity: 0.54;
    }

    .bubble-extra-3 {
      width: 14%;
      top: 28%;
      left: 5%;
      opacity: 0.46;
    }

    .bubble-extra-4 {
      width: 9%;
      top: 36%;
      left: 21%;
      opacity: 0.34;
    }

    .bubble-extra-5 {
      width: 7%;
      top: 2%;
      left: 36%;
      opacity: 0.26;
    }


    /* Around centre bubbles */

    .bubble-extra-6 {
      width: 7%;
      top: 58%;
      left: 38%;
      opacity: 0.60;
    }

    .bubble-extra-7 {
      width: 6%;
      top: 69%;
      left: 51%;
      opacity: 0.48;
    }

    .bubble-extra-8 {
      width: 5%;
      top: 82%;
      left: 48%;
      opacity: 0.34;
    }

    .bubble-extra-9 {
      width: 4%;
      top: 62%;
      left: 53%;
      opacity: 0.24;
    }


    /* Around right-side bubbles */

    .bubble-extra-10 {
      width: 25%;
      top: 46%;
      right: 1%;
      opacity: 0.66;
    }

    .bubble-extra-11 {
      width: 20%;
      top: 64%;
      right: 25%;
      opacity: 0.52;
    }

    .bubble-extra-12 {
      width: 15%;
      top: 74%;
      right: 31%;
      opacity: 0.42;
    }

    .bubble-extra-13 {
      width: 11%;
      top: 41%;
      right: 17%;
      opacity: 0.32;
    }

    .bubble-extra-14 {
      width: 8%;
      top: 82%;
      right: 17%;
      opacity: 0.25;
    }

    .bubble-extra-15 {
      width: 6%;
      top: 34%;
      right: 5%;
      opacity: 0.20;
    }


    /* =========================================
       TABLET
    ========================================= */

    @media (max-width: 900px) {

      .hero {
        grid-template-columns: 1fr;
      }

      .hero-left {
        min-height: 50vh;
      }

      .hero-image {
        min-height: 70vh;

        border-left: none;
        border-top: 1px solid var(--black);
      }

      .bubble-field {
        position: absolute;
      }

    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

      header {
        height: 60px;
      }

      nav {
        gap: 15px;
      }

      nav a {
        font-size: 12px;
      }

      .hero-left {
        min-height: 55vh;
      }

      .hero-description {
        font-size: clamp(24px, 7vw, 34px);
      }

      .hero-image {
        min-height: 65vh;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       HEADER
  ========================================= -->

  <header>

    <a href="#" class="logo">
      Malin Hall
    </a>

    <nav>
      <a href="#work">Work</a>
      <a href="#about">About me</a>
      <a href="#contact">Contact</a>
    </nav>

  </header>


  <!-- =========================================
       HERO
  ========================================= -->

  <main>

    <section class="hero">


      <!-- =====================================
           BUBBLES — FULL HERO
      ====================================== -->

      <div class="bubble-field">

        <!-- MAIN BUBBLES -->

        <div class="bubble bubble-green bubble-main-1"></div>

        <div class="bubble bubble-yellow bubble-main-2"></div>

        <div class="bubble bubble-green bubble-main-3"></div>

        <div class="bubble bubble-yellow bubble-main-4"></div>

        <div class="bubble bubble-green bubble-main-5"></div>

        <div class="bubble bubble-yellow bubble-main-6"></div>


        <!-- EXTRA BUBBLES -->

        <div class="bubble bubble-yellow bubble-extra-1"></div>
        <div class="bubble bubble-green bubble-extra-2"></div>
        <div class="bubble bubble-brown bubble-extra-3"></div>
        <div class="bubble bubble-yellow bubble-extra-4"></div>
        <div class="bubble bubble-green bubble-extra-5"></div>

        <div class="bubble bubble-yellow bubble-extra-6"></div>
        <div class="bubble bubble-green bubble-extra-7"></div>
        <div class="bubble bubble-brown bubble-extra-8"></div>
        <div class="bubble bubble-yellow bubble-extra-9"></div>

        <div class="bubble bubble-green bubble-extra-10"></div>
        <div class="bubble bubble-yellow bubble-extra-11"></div>
        <div class="bubble bubble-brown bubble-extra-12"></div>
        <div class="bubble bubble-green bubble-extra-13"></div>
        <div class="bubble bubble-yellow bubble-extra-14"></div>
        <div class="bubble bubble-green bubble-extra-15"></div>

      </div>


      <!-- =====================================
           LEFT
      ====================================== -->

      <div class="hero-left">

        <div class="hero-eyebrow">
          Digital production · UX/HCI · Technical systems
        </div>

        <h1 class="hero-title">
          Malin Hall
        </h1>

        <p class="hero-description">
          Lorem ipsum dolor sit amet, consectetur adipiscing elit.
          Integer posuere erat a ante.
        </p>

        <a href="#work" class="hero-scroll">
          Scroll to explore ↓
        </a>

      </div>


      <!-- =====================================
           RIGHT / PORTRAIT
      ====================================== -->

      <div class="hero-image">

        <div class="bubble-portrait"></div>

      </div>


    </section>

  </main>


</body>
</html>
